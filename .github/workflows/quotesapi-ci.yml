name: QuotesApi CI

on:
  push:
    paths:
      - "Day -3/QuotesApi/**"
      - "Day -3/QuotesApi.Tests/**"
      - ".github/workflows/quotesapi-ci.yml"
  pull_request:
    paths:
      - "Day -3/QuotesApi/**"
      - "Day -3/QuotesApi.Tests/**"
      - ".github/workflows/quotesapi-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        working-directory: "Day -3/QuotesApi.Tests"
        run: dotnet restore

      - name: Build
        working-directory: "Day -3/QuotesApi.Tests"
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        working-directory: "Day -3/QuotesApi.Tests"
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quotesapi-test-results
          path: "Day -3/QuotesApi.Tests/TestResults/test-results.trx"
